name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build
          tar -czf dist.tar.gz dist/

      - name: Transfer Files to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 148.135.138.47
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "frontend/dist.tar.gz"
          target: "/tmp"

      - name: Deploy and Restart (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 148.135.138.47
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            echo "--- Updating Frontend Assets ---"
            mkdir -p /var/www/family-tree/frontend
            rm -rf /var/www/family-tree/frontend/dist.old
            [ -d /var/www/family-tree/frontend/dist ] && mv /var/www/family-tree/frontend/dist /var/www/family-tree/frontend/dist.old
            
            tar -xzf /tmp/frontend/dist.tar.gz -C /var/www/family-tree/frontend/
            rm /tmp/frontend/dist.tar.gz
            
            echo "--- Updating Backend Code ---"
            cd /root/family-tree
            git pull origin main
            
            echo "--- Restarting Service ---"
            systemctl restart family-tree
            echo "--- Deployment Successful ---"
