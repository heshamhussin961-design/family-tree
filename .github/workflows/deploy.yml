name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 148.135.138.47
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /root/family-tree
            git pull origin main
            
            # Restart Service
            systemctl restart family-tree
