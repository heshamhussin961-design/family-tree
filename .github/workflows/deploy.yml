name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build
          cd ..

      - name: Prepare Deployment Package
        run: |
          # Package backend and frontend dist into a single archive, excluding unnecessary data
          tar --exclude='**/__pycache__' --exclude='backend/venv' --exclude='backend/*.db' -czf deploy.tar.gz backend/ frontend/dist/

      - name: Transfer Package to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 148.135.138.47
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "deploy.tar.gz"
          target: "/tmp"

      - name: Deploy and Restart (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 148.135.138.47
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            echo "--- Extracting Deployment Package ---"
            # Extract to a temp dir
            rm -rf /tmp/deploy_extract
            mkdir -p /tmp/deploy_extract
            tar -xzf /tmp/deploy.tar.gz -C /tmp/deploy_extract
            
            echo "--- Updating Frontend Assets ---"
            # Ensure target dirs exist
            mkdir -p /var/www/family-tree/frontend
            # Backup & Swap dist
            rm -rf /var/www/family-tree/frontend/dist.old
            [ -d /var/www/family-tree/frontend/dist ] && mv /var/www/family-tree/frontend/dist /var/www/family-tree/frontend/dist.old
            cp -r /tmp/deploy_extract/frontend/dist /var/www/family-tree/frontend/
            
            echo "--- Updating Backend Code ---"
            # Sync backend files to /root/family-tree
            mkdir -p /root/family-tree/backend
            cp -r /tmp/deploy_extract/backend/* /root/family-tree/backend/
            
            echo "--- Fixing .env and Dependencies ---"
            # Ensure we are in the backend directory
            cd /root/family-tree/backend
            
            if [ -f requirements.txt ]; then
                /usr/bin/python3 -m pip install --upgrade -r requirements.txt
            fi
            
            echo "--- Restarting Service ---"
            systemctl reload nginx
            systemctl restart family-tree
            # Force table creation
            python3 -c "from db import engine, Base; import models; Base.metadata.create_all(bind=engine); print('DB Verified')"
            echo "--- Deployment Successful ---"
