name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Deploy Frontend to Server (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 148.135.138.47
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "frontend/dist/*"
          target: "/var/www/family-tree/frontend/dist"
          strip_components: 2

      - name: Deploy Backend & Restart Service (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 148.135.138.47
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            echo "--- Updating Backend ---"
            cd /root/family-tree
            git pull origin main
            
            echo "--- Restarting Service ---"
            systemctl restart family-tree
            echo "--- Deployment Successful ---"
